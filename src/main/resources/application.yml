server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG

spring:
  application:
    name: uniride-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            ssl:
              use-insecure-trust-manager: true
          default-filters:
            - RemoveRequestHeader=Host
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            # === IAM SERVICE ===
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://iam-service:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: iam-swagger
              uri: ${IAM_SERVICE_URL:http://iam-service:8081}
              predicates:
                - Path=/iam/swagger-ui.html,/iam/swagger-ui/**,/iam/v3/api-docs/**,/iam/v3/api-docs
              filters:
                - RewritePath=/iam/(?<segment>.*), /${segment}

            # === ROUTES SERVICE ===
            - id: routes-service
              uri: ${ROUTES_SERVICE_URL:http://routes-service:8082}
              predicates:
                - Path=/api/v1/routes/**
            - id: routes-swagger
              uri: ${ROUTES_SERVICE_URL:http://routes-service:8082}
              predicates:
                - Path=/routes/swagger-ui.html,/routes/swagger-ui/**,/routes/v3/api-docs/**,/routes/v3/api-docs
              filters:
                - RewritePath=/routes/(?<segment>.*), /${segment}

            # === BOOKING SERVICE ===
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://booking-service:8083}
              predicates:
                - Path=/api/v1/bookings/**
            - id: booking-swagger
              uri: ${BOOKING_SERVICE_URL:http://booking-service:8083}
              predicates:
                - Path=/bookings/swagger-ui.html,/bookings/swagger-ui/**,/bookings/v3/api-docs/**,/bookings/v3/api-docs
              filters:
                - RewritePath=/bookings/(?<segment>.*), /${segment}

            # === FINANCE SERVICE ===
            - id: finance-service
              uri: ${FINANCE_SERVICE_URL:http://finance-service:8084}
              predicates:
                - Path=/api/v1/finance/**
            - id: finance-swagger
              uri: ${FINANCE_SERVICE_URL:http://finance-service:8084}
              predicates:
                - Path=/finance/swagger-ui.html,/finance/swagger-ui/**,/finance/v3/api-docs/**,/finance/v3/api-docs
              filters:
                - RewritePath=/finance/(?<segment>.*), /${segment}

            # === TRIPS SERVICE ===
            - id: trips-service
              uri: ${TRIPS_SERVICE_URL:http://trips-service:8085}
              predicates:
                - Path=/api/v1/trips/**
            - id: trips-swagger
              uri: ${TRIPS_SERVICE_URL:http://trips-service:8085}
              predicates:
                - Path=/trips/swagger-ui.html,/trips/swagger-ui/**,/trips/v3/api-docs/**,/trips/v3/api-docs
              filters:
                - RewritePath=/trips/(?<segment>.*), /${segment}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway